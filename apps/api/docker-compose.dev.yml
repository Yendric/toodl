services:
  toodl_api:
    container_name: toodl_api
    stdin_open: true
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      - TZ=Europe/Brussels
    volumes:
      - ../..:/repo
      - /repo/node_modules
      - /repo/apps/api/node_modules
    ports:
      - ${PORT}:${PORT}
    depends_on:
      database:
        condition: service_healthy
  database:
    container_name: toodl_postgres
    image: postgres
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
