version: "3.8"

services:
  toodl_api:
    container_name: toodl_api
    image: ghcr.io/yendric/toodl:latest
    restart: always
    volumes:
      - ./sessions:/repo/apps/api/sessions
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
  database:
    container_name: toodl_postgres
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
